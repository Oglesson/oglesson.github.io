<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Placeholder screenshot of the Chronology app">
	<rect width="1200" height="900" fill="#e1d8fd" />
	<rect x="0" y="0" width="1200" height="90" fill="#3c027d" />
	<circle cx="55" cy="45" r="16" fill="#e1d8fd" />
	<rect x="90" y="36" width="220" height="18" rx="9" fill="#8d7cbf" />
	<rect x="60" y="150" width="1080" height="620" rx="16" fill="#ffffff" />
